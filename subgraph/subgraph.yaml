specVersion: 1.3.0
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: ArbiterPaymentManager
    network: arbitrum-sepolia
    source:
      address: '0x6b5BA9E3E8175eCfB8291FA0ee358b070c0522Cc'
      abi: ArbiterPaymentManager
      startBlock: 310955000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Payment
        - Settlement
        - InvoiceReference
      abis:
        - name: ArbiterPaymentManager
          file: ./abis/ArbiterPaymentManager.json
      eventHandlers:
        - event: PaymentCreated(indexed bytes32,indexed uint8,indexed address,address,uint256,uint256)
          handler: handlePaymentCreated
        - event: PaymentReleased(indexed bytes32)
          handler: handlePaymentReleased
        - event: PaymentCancelled(indexed bytes32,uint256)
          handler: handlePaymentCancelled
      file: ./src/mapping.ts
